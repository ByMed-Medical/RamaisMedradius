<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ramais MedRadius</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-[#090e1b] text-slate-200 min-h-screen">

<div class="max-w-7xl mx-auto p-6">

    <!-- Cabeçalho -->
    <div class="flex justify-between items-center mb-8">
        <div class="text-center flex-1">
            <img src="https://i.ibb.co/1S3TgBH/logo-G-Dark.png" alt="MedRadius" class="mx-auto h-32">
        </div>
        <button id="tiBtn" class="px-5 py-2.5 bg-slate-700 hover:bg-slate-600 rounded-2xl flex items-center gap-2">
            <i class="fa-solid fa-shield-halved"></i> <span>Modo TI</span>
        </button>
    </div>

    <!-- Busca -->
    <div class="flex flex-col sm:flex-row gap-3 mb-8 max-w-3xl mx-auto">
        <input id="search" placeholder="🔎 Buscar..." class="flex-1 bg-slate-800 border border-slate-600 rounded-2xl px-5 py-4 focus:outline-none">
        <select id="localFilter" class="bg-slate-800 border border-slate-600 rounded-2xl px-5 py-4">
            <option value="">Todos os locais</option>
            <!-- opções -->
        </select>
    </div>

    <div id="status" class="text-center text-yellow-400 mb-6"></div>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
        <div class="lg:col-span-4 bg-slate-800 rounded-3xl p-5">
            <h2 class="text-blue-400 font-bold mb-4">🧠 Mapa Mental</h2>
            <div id="treeView"></div>
        </div>
        <div class="lg:col-span-8">
            <div id="cardsContainer" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
        </div>
    </div>
</div>

<script defer>
    let ramaisData = [];

    async function loadRamais() {
        const status = document.getElementById('status');
        status.textContent = "🔄 Carregando ramais.json...";

        try {
            const response = await fetch('./ramais.json', { 
                cache: 'no-store',
                headers: { 'Pragma': 'no-cache' }
            });

            console.log("Status da resposta:", response.status);

            if (!response.ok) {
                throw new Error(`HTTP ${response.status} - Arquivo não encontrado`);
            }

            ramaisData = await response.json();
            console.log(`✅ Carregados ${ramaisData.length} ramais`);

            status.innerHTML = `<span class="text-emerald-400">✅ ${ramaisData.length} ramais carregados com sucesso!</span>`;
            
            renderCards(ramaisData);
            renderTree();

        } catch (err) {
            console.error(err);
            status.innerHTML = `
                <span class="text-red-400">❌ Erro ao carregar ramais.json</span><br>
                <small class="text-slate-400">${err.message}</small><br><br>
                <span class="text-xs">Verifique se o arquivo <b>ramais.json</b> está na raiz do projeto.</span>
            `;
        }
    }

    function renderCards(items) {
        const container = document.getElementById('cardsContainer');
        container.innerHTML = items.map(item => `
            <div class="bg-slate-800 rounded-3xl p-6 border border-slate-700">
                <div class="flex justify-between items-start mb-4">
                    <div class="text-5xl font-bold text-blue-400">${item.ramal}</div>
                    <div class="text-right text-sm">
                        <div>${item.setor}</div>
                        <div class="text-slate-400">${item.local}</div>
                    </div>
                </div>
                <div class="text-sm text-slate-300">${item.subsetor || ''}</div>
                <div class="text-xs text-slate-400 mt-1">${item.colaborador || ''}</div>
            </div>
        `).join('');
    }

    function renderTree() {
        // Simplificado por enquanto
        document.getElementById('treeView').innerHTML = `<p class="text-slate-400">(${ramaisData.length} ramais carregados)</p>`;
    }

    // Inicialização
    document.addEventListener('DOMContentLoaded', loadRamais);
</script>
</body>
</html>
