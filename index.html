<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ramais MedRadius - Diretório Inteligente</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        body {
            background: #090e1b;
            color: #e2e8f0;
            font-family: system-ui, -apple-system, sans-serif;
        }

        .ramal-card {
            background: #1e2937;
            border: 1px solid #334155;
            transition: all 0.3s ease;
        }
        .ramal-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.726);
        }

        .bg-gradient-header {
            background: linear-gradient(to right, #1e40af, #4338ca);
        }

        #treeView {
            font-size: 0.78rem;
        }
        #treeView details > summary {
            background: #1e2937;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 10px 14px;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-weight: 600;
        }
        #treeView details[open] > summary {
            border-color: #60a5fa;
        }
        #treeView > details > div {
            padding-left: 18px;
            margin-top: 3px;
            margin-bottom: 2px;
        }
        #treeView .pl-6 {
            padding-left: 1.1rem;
            font-size: 0.75rem;
        }
    </style>
</head>
<body class="min-h-screen">

<div class="max-w-7xl mx-auto p-6 md:p-8">

    <div class="flex justify-between items-center mb-8">
        <div class="text-center flex-1">
            <img src="https://i.ibb.co/1S3TgBH/logo-G-Dark.png" 
                 alt="Logo MedRadius" 
                 class="mx-auto h-28 md:h-40 object-contain">
            <p class="text-slate-400 font-medium text-lg mt-2">
                Diretório dinâmico • Hospital • Clínica • Consultórios • Mangabeiras
            </p>
        </div>
        <button id="tiBtn"
                class="px-5 py-2.5 bg-slate-700 hover:bg-slate-600 rounded-2xl text-sm flex items-center gap-2 transition-all">
            <i class="fa-solid fa-shield-halved"></i>
            <span>Modo TI</span>
        </button>
    </div>

    <div class="flex flex-col sm:flex-row gap-3 mb-8 max-w-3xl mx-auto">
        <input 
            id="search" 
            type="text" 
            placeholder="🔎 Buscar ramal, setor ou Colaborador..." 
            class="flex-1 border border-gray-300 rounded-xl px-4 py-3 text-base focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500"
        >
        <select 
            id="localFilter" 
            class="bg-gray-800 border border-gray-700 text-white rounded-xl px-4 py-3 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 sm:w-64"
        >
            <option value="">Todos os locais</option>
            <option value="MEDRADIUS CLINICA">MEDRADIUS CLINICA</option>
            <option value="MEDRADIUS CONSULTÓRIO 1">MEDRADIUS CONSULTÓRIO 1</option>
            <option value="MEDRADIUS CONSULTÓRIO 2">MEDRADIUS CONSULTÓRIO 2</option>
            <option value="MEDRADIUS HOSPITAL">MEDRADIUS HOSPITAL</option>
            <option value="MEDRADIUS MANGABEIRAS">MEDRADIUS MANGABEIRAS</option>
        </select>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
        <!-- Mapa Mental -->
        <div class="lg:col-span-4 bg-slate-800 rounded-3xl shadow p-5 h-fit">
            <h2 class="font-bold text-xl mb-4 flex items-center gap-3 text-blue-400">
                <i class="fa-solid fa-sitemap"></i> Mapa Mental
            </h2>
            <div id="treeView" class="space-y-1 pr-1 max-h-[78vh] overflow-auto custom-scroll"></div>
        </div>

        <!-- Cards -->
        <div class="lg:col-span-8">
            <div id="resultInfo" class="text-slate-400 mb-4 pl-1 text-sm"></div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6" id="cardsContainer"></div>
        </div>
    </div>

    <button onclick="toggleTable()" 
            class="mt-12 mx-auto flex items-center gap-3 px-8 py-4 bg-blue-600 hover:bg-blue-700 text-white rounded-2xl font-medium text-lg transition-all">
        <i class="fa-solid fa-table"></i> Ver Tabela Completa
    </button>

    <div id="tableView" class="hidden mt-8 overflow-x-auto bg-slate-800 rounded-3xl shadow p-6">
        <table class="w-full text-sm" id="fullTable">
            <thead class="bg-slate-700">
                <tr id="tableHeader"></tr>
            </thead>
            <tbody id="tableBody" class="divide-y divide-slate-700"></tbody>
        </table>
    </div>
</div>

<footer class="fixed bottom-3 left-4 text-xs text-slate-500 font-light pointer-events-none select-none z-10">
    Byron S. Medeiros
</footer>

<script defer>
    let ramaisData = [];
    let isTiMode = false;
    const TI_PASSWORD = "ti2026";

    // ==================== CARREGAR RAMAIS.JSON ====================
    async function loadRamais() {
        try {
            console.log("🔄 Tentando carregar ramais.json...");
            
            const response = await fetch('./ramais.json', { 
                cache: 'no-store',
                headers: { 'Cache-Control': 'no-cache' }
            });
            
            console.log("📡 Status:", response.status, response.statusText);

            if (!response.ok) {
                throw new Error(`HTTP ${response.status} - ${response.statusText}`);
            }

            const contentType = response.headers.get("content-type");
            if (!contentType || !contentType.includes("application/json")) {
                throw new Error("Recebido conteúdo inválido: " + contentType);
            }

            ramaisData = await response.json();
            
            console.log(`✅ Sucesso! ${ramaisData.length} ramais carregados.`);
            
            renderCards(ramaisData);
            renderTree();
            document.getElementById('resultInfo').textContent = 
                `${ramaisData.length} ramais carregados`;

        } catch (error) {
            console.error("❌ Erro completo:", error);
            document.getElementById('cardsContainer').innerHTML = `
                <div class="col-span-full text-center py-20">
                    <p class="text-red-400 text-xl">❌ Erro ao carregar ramais.json</p>
                    <p class="text-slate-400 mt-2">${error.message}</p>
                    <p class="text-slate-500 text-sm mt-4">Verifique se o arquivo ramais.json está na raiz e se o vercel.json está correto.</p>
                </div>`;
        }
    }

    // ==================== RENDER CARDS ====================
    function renderCards(items) {
        const container = document.getElementById('cardsContainer');
        container.innerHTML = '';

        if (items.length === 0) {
            container.innerHTML = '<p class="col-span-full text-center py-20 text-slate-400 text-lg">Nenhum ramal encontrado</p>';
            return;
        }

        items.forEach(item => {
            const card = document.createElement('div');
            card.className = 'ramal-card rounded-3xl shadow overflow-hidden flex flex-col';

            const subsetores = (item.subsetor || '').split(/[/,;|]\s*/).map(s => s.trim()).filter(Boolean);
            const colaboradores = (item.colaborador || '').split(/[/,;|]\s*/).map(s => s.trim()).filter(Boolean);

            let rowsHTML = '';
            const max = Math.max(subsetores.length, colaboradores.length, 1);

            for (let i = 0; i < max; i++) {
                rowsHTML += `
                    <tr class="hover:bg-slate-700 transition-colors">
                        <td class="p-3">${subsetores[i] || '—'}</td>
                        <td class="p-3">${colaboradores[i] || '—'}</td>
                        ${isTiMode ? `<td class="p-3 font-mono text-slate-300">${item.Workstation || '—'}</td>` : ''}
                    </tr>`;
            }

            card.innerHTML = `
                <div class="bg-gradient-header text-white px-6 py-5 flex justify-between items-start">
                    <div class="text-6xl font-black tracking-tighter">${item.ramal}</div>
                    <div class="text-right">
                        <div class="text-sm font-semibold uppercase">${item.setor}</div>
                        <div class="text-xs opacity-75 mt-1">${item.local}</div>
                    </div>
                </div>
                <div class="p-6">
                    <table class="w-full text-sm border border-slate-600 rounded-xl overflow-hidden">
                        <thead class="bg-slate-700">
                            <tr>
                                <th class="p-3 text-left">Subsetor</th>
                                <th class="p-3 text-left">Colaborador</th>
                                ${isTiMode ? `<th class="p-3 text-left">Workstation</th>` : ''}
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-600">
                            ${rowsHTML}
                        </tbody>
                    </table>
                </div>
            `;
            container.appendChild(card);
        });
    }

    // ==================== RENDER TREE ====================
    function renderTree() {
        const container = document.getElementById('treeView');
        container.innerHTML = '';
        const grouped = {};

        ramaisData.forEach(item => {
            if (!grouped[item.local]) grouped[item.local] = {};
            if (!grouped[item.local][item.setor]) grouped[item.local][item.setor] = [];
            grouped[item.local][item.setor].push(item);
        });

        Object.keys(grouped).sort().forEach(local => {
            const details = document.createElement('details');
            details.innerHTML = `
                <summary class="flex justify-between items-center">
                    <span class="truncate">${local}</span>
                    <span class="text-xs bg-slate-700 px-2 py-0.5 rounded-full shrink-0">${Object.keys(grouped[local]).length} setores</span>
                </summary>`;
            
            const inner = document.createElement('div');
            inner.className = 'space-y-1';

            Object.keys(grouped[local]).sort().forEach(setor => {
                const subDetails = document.createElement('details');
                subDetails.innerHTML = `
                    <summary class="font-medium text-slate-300 flex justify-between items-center">
                        <span class="truncate">${setor}</span>
                        <span class="text-xs text-slate-500 shrink-0">(${grouped[local][setor].length})</span>
                    </summary>`;
                
                const list = document.createElement('div');
                list.className = 'pl-5 text-xs space-y-0.5 mt-1';

                grouped[local][setor].forEach(r => {
                    const row = document.createElement('div');
                    row.className = 'flex justify-between hover:bg-slate-700 p-2 rounded-xl cursor-pointer truncate';
                    row.onclick = () => copyRamal(r.ramal);
                    row.innerHTML = `
                        <span class="text-blue-400">${r.ramal}</span>
                        <span class="text-slate-300 truncate">${r.subsetor || ''}</span>
                    `;
                    list.appendChild(row);
                });
                subDetails.appendChild(list);
                inner.appendChild(subDetails);
            });
            details.appendChild(inner);
            container.appendChild(details);
        });
    }

    function filterData() {
        const term = document.getElementById('search').value.toLowerCase().trim();
        const localValue = document.getElementById('localFilter').value;

        const filtered = ramaisData.filter(item => {
            if (localValue && item.local !== localValue) return false;
            if (!term) return true;
            return Object.values(item).some(v => v && v.toString().toLowerCase().includes(term));
        });

        renderCards(filtered);
        document.getElementById('resultInfo').textContent = `${filtered.length} de ${ramaisData.length} ramais encontrados`;
    }

    function toggleTable() {
        const tableView = document.getElementById('tableView');
        tableView.classList.toggle('hidden');
        if (!tableView.classList.contains('hidden')) renderFullTable();
    }

    function renderFullTable() {
        const header = document.getElementById('tableHeader');
        const tbody = document.getElementById('tableBody');

        header.innerHTML = `
            <th class="p-4 text-left">Local</th>
            <th class="p-4 text-left">Setor</th>
            <th class="p-4 text-left">Subsetor</th>
            <th class="p-4 text-left">Ramal</th>
            ${isTiMode ? `<th class="p-4 text-left">Workstation</th><th class="p-4 text-left">Colaborador</th>` : ''}
        `;

        tbody.innerHTML = ramaisData.map(item => `
            <tr class="border-b border-slate-700 hover:bg-slate-700 cursor-pointer" onclick="copyRamal('${item.ramal}')">
                <td class="p-4">${item.local}</td>
                <td class="p-4">${item.setor}</td>
                <td class="p-4">${item.subsetor || ''}</td>
                <td class="p-4 font-bold text-blue-400">${item.ramal}</td>
                ${isTiMode ? `
                <td class="p-4 font-mono">${item.Workstation || ''}</td>
                <td class="p-4">${item.colaborador || ''}</td>` : ''}
            </tr>
        `).join('');
    }

    window.copyRamal = function(ramal) {
        navigator.clipboard.writeText(ramal);
        const toast = document.createElement('div');
        toast.className = "fixed bottom-8 right-8 bg-emerald-600 text-white px-6 py-3 rounded-2xl shadow-2xl z-50";
        toast.textContent = `✅ Ramal ${ramal} copiado!`;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 2000);
    };

    document.getElementById('tiBtn').addEventListener('click', () => {
        if (isTiMode) {
            isTiMode = false;
            document.getElementById('tiBtn').classList.remove('bg-emerald-600');
            document.getElementById('tiBtn').innerHTML = `<i class="fa-solid fa-shield-halved"></i><span>Modo TI</span>`;
        } else {
            const senha = prompt("🔑 Digite a senha do Modo TI:");
            if (senha === TI_PASSWORD) {
                isTiMode = true;
                document.getElementById('tiBtn').classList.add('bg-emerald-600');
                document.getElementById('tiBtn').innerHTML = `<i class="fa-solid fa-shield-halved"></i><span>Modo TI ✓</span>`;
            } else {
                alert("❌ Senha incorreta!");
                return;
            }
        }
        filterData();
        const tableView = document.getElementById('tableView');
        if (!tableView.classList.contains('hidden')) renderFullTable();
    });

    // ==================== INICIALIZAÇÃO ====================
    document.addEventListener('DOMContentLoaded', () => {
        loadRamais();
        
        document.getElementById('search').addEventListener('input', filterData);
        document.getElementById('localFilter').addEventListener('change', filterData);
    });
</script>
</body>
</html>
