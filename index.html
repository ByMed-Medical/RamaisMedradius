<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ramais MedRadius - Diretório Inteligente</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        body { background: #090e1b; color: #e2e8f0; font-family: system-ui, sans-serif; }
        .ramal-card { background: #1e2937; border: 1px solid #334155; transition: all 0.3s ease; }
        .ramal-card:hover { transform: translateY(-4px); box-shadow: 0 20px 25px -5px rgba(0,0,0,0.7); }

        #treeView details > summary {
            background: #1e2937;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 6px;
        }
        #treeView details[open] > summary { border-color: #60a5fa; background: #1e40af; }
    </style>
</head>
<body class="min-h-screen">

<div class="max-w-screen-2xl mx-auto p-4 md:p-6 lg:p-8">

    <div class="flex justify-between items-center mb-8">
        <div class="text-center flex-1">
            <img src="https://i.ibb.co/1S3TgBH/logo-G-Dark.png" alt="MedRadius" class="mx-auto h-28 md:h-40 object-contain">
            <p class="text-slate-400 font-medium text-lg mt-2">Diretório dinâmico • Hospital • Clínica • Consultórios • Mangabeiras</p>
        </div>
        <button id="tiBtn" class="px-5 py-2.5 bg-slate-700 hover:bg-slate-600 rounded-2xl text-sm flex items-center gap-2 transition-all">
            <i class="fa-solid fa-shield-halved"></i><span>Modo TI</span>
        </button>
    </div>

    <div class="flex flex-col sm:flex-row gap-3 mb-8 max-w-3xl mx-auto">
        <input id="search" type="text" placeholder="🔎 Buscar ramal, setor ou Colaborador..." 
               class="flex-1 bg-slate-800 border border-slate-600 rounded-2xl px-5 py-4 focus:outline-none focus:border-blue-500">
        <select id="localFilter" class="bg-slate-800 border border-slate-600 rounded-2xl px-5 py-4 focus:outline-none focus:border-blue-500">
            <option value="">Todos os locais</option>
            <option value="MEDRADIUS CLINICA">MEDRADIUS CLINICA</option>
            <option value="MEDRADIUS CONSULTÓRIO 1">MEDRADIUS CONSULTÓRIO 1</option>
            <option value="MEDRADIUS CONSULTÓRIO 2">MEDRADIUS CONSULTÓRIO 2</option>
            <option value="MEDRADIUS HOSPITAL">MEDRADIUS HOSPITAL</option>
            <option value="MEDRADIUS MANGABEIRAS">MEDRADIUS MANGABEIRAS</option>
        </select>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
        <div class="lg:col-span-4 bg-slate-800 rounded-3xl shadow p-5 h-fit">
            <h2 class="font-bold text-xl mb-4 flex items-center gap-3 text-blue-400">
                <i class=></i> Mapa Mental
            </h2>
            <div id="treeView" class="space-y-1 pr-1"></div>
        </div>

        <div class="lg:col-span-8">
            <div id="resultInfo" class="text-emerald-400 mb-4 pl-1"></div>
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6" id="cardsContainer"></div>
        </div>
    </div>

        <button onclick="toggleTable()" 
            class="mt-12 mx-auto flex items-center gap-3 px-8 py-4 bg-blue-600 hover:bg-blue-700 text-white rounded-2xl font-medium text-lg transition-all">
        <i class="fa-solid fa-table"></i> Ver Tabela Completa
    </button>

    <div id="tableView" class="hidden mt-8 overflow-x-auto bg-slate-800 rounded-3xl shadow p-6">
        <table class="w-full text-sm" id="fullTable">
            <thead class="bg-slate-700">
                <tr id="tableHeader"></tr>
            </thead>
            <tbody id="tableBody" class="divide-y divide-slate-700"></tbody>
        </table>
    </div>

<!-- Botão Gerenciar -->
<button id="adminBtn" onclick="openAdminModal()" 
        class="hidden fixed bottom-8 right-8 bg-emerald-600 hover:bg-emerald-700 text-white px-6 py-4 rounded-2xl shadow-2xl flex items-center gap-3 text-lg font-medium z-50">
    <i class="fa-solid fa-gear"></i> Gerenciar Ramais
</button>

<!-- MODAL ADMIN -->
<div id="adminModal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-[100]">
    <div class="bg-slate-900 rounded-3xl w-full max-w-5xl max-h-[95vh] m-4 flex flex-col overflow-hidden">
        <div class="p-6 border-b border-slate-700 bg-slate-800 flex justify-between items-center">
            <h2 class="text-2xl font-bold">🛠️ Gerenciar Ramais</h2>
            <button onclick="closeAdminModal()" class="text-4xl text-slate-400 hover:text-white">×</button>
        </div>
        
        <div class="p-6 flex-1 overflow-auto">
            <div class="flex flex-wrap gap-3 mb-6">
                <button onclick="addNewRamal()" class="bg-blue-600 hover:bg-blue-700 px-6 py-3 rounded-2xl flex items-center gap-2 font-medium">
                    <i class="fa-solid fa-plus"></i> Adicionar Novo
                </button>
                <button onclick="exportJSON()" class="bg-slate-700 hover:bg-slate-600 px-6 py-3 rounded-2xl">📤 Exportar JSON</button>
                <button onclick="exportCSV()" class="bg-slate-700 hover:bg-slate-600 px-6 py-3 rounded-2xl">📤 Exportar CSV</button>
                <label class="bg-slate-700 hover:bg-slate-600 px-6 py-3 rounded-2xl cursor-pointer">
                    📥 Importar CSV <input type="file" id="csvImport" accept=".csv" class="hidden" onchange="importCSV(event)">
                </label>
            </div>

            <table class="w-full text-sm" id="adminTable">
                <thead class="bg-slate-800 sticky top-0">
                    <tr>
                        <th class="p-3 text-left">Local</th>
                        <th class="p-3 text-left">Setor</th>
                        <th class="p-3 text-left">Subsetor</th>
                        <th class="p-3 text-left">Ramal</th>
                        <th class="p-3 text-left">Colaborador</th>
                        <th class="p-3 text-left">Workstation</th>
                        <th class="p-3 text-center w-20">Ações</th>
                    </tr>
                </thead>
                <tbody id="adminTableBody" class="divide-y divide-slate-700"></tbody>
            </table>
        </div>
    </div>
</div>

<script defer>
    let ramaisData = [];
    let isTiMode = false;
    const TI_PASSWORD = "ti2026";

    async function loadRamais() {
        try {
            const res = await fetch('./ramais.json', { cache: 'no-store' });
            ramaisData = await res.json();
            document.getElementById('resultInfo').innerHTML = `✅ ${ramaisData.length} ramais carregados com sucesso!`;
            renderCards(ramaisData);
            renderTree();
        } catch (e) { console.error(e); }
    }

    function renderCards(items) {
    const container = document.getElementById('cardsContainer');
    container.innerHTML = '';

    if (items.length === 0) {
        container.innerHTML = '<p class="col-span-full text-center py-20 text-slate-400 text-lg">Nenhum ramal encontrado</p>';
        return;
    }

    items.forEach(item => {
        const card = document.createElement('div');
        card.className = 'ramal-card rounded-3xl shadow overflow-hidden';

        const subsetores = (item.subsetor || '').split(/[/,;|]\s*/).map(s => s.trim()).filter(Boolean);
        const colaboradores = (item.colaborador || '').split(/[/,;|]\s*/).map(s => s.trim()).filter(Boolean);
        const workstations = (item.Workstation || '').split(/[/,;|]\s*/).map(s => s.trim()).filter(Boolean);

        const maxRows = Math.max(subsetores.length, colaboradores.length, workstations.length, 1);

        let rowsHTML = '';
        for (let i = 0; i < maxRows; i++) {
            rowsHTML += `
                <tr class="hover:bg-slate-700">
                    <td class="p-5">${subsetores[i] || '—'}</td>
                    <td class="p-5">${colaboradores[i] || '—'}</td>
                    ${isTiMode ? `<td class="p-5 font-mono text-emerald-300">${workstations[i] || '—'}</td>` : ''}
                </tr>`;
        }

        card.innerHTML = `
            <div class="bg-gradient-to-r from-blue-700 to-indigo-700 text-white px-8 py-6 flex justify-between items-start">
                <div class="text-6xl font-black tracking-tighter">${item.ramal}</div>
                <div class="text-right">
                    <div class="font-semibold uppercase">${item.setor}</div>
                    <div class="text-sm opacity-75">${item.local}</div>
                </div>
            </div>
            <div class="p-6">
                <table class="w-full text-sm">
                    <thead>
                        <tr class="border-b border-slate-600">
                            <th class="p-4 text-left">Subsetor</th>
                            <th class="p-4 text-left">Colaborador</th>
                            ${isTiMode ? `<th class="p-4 text-left">Workstation</th>` : ''}
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-700">
                        ${rowsHTML}
                    </tbody>
                </table>
            </div>
         `;
         container.appendChild(card);
       });
    }

    // Restante do código (renderTree, filterData, admin, etc.) mantido igual
    function renderTree() {
        const container = document.getElementById('treeView');
        container.innerHTML = '';
        const grouped = {};

        ramaisData.forEach(item => {
            if (!grouped[item.local]) grouped[item.local] = {};
            if (!grouped[item.local][item.setor]) grouped[item.local][item.setor] = [];
            grouped[item.local][item.setor].push(item);
        });

        Object.keys(grouped).sort().forEach(local => {
            const details = document.createElement('details');
            details.innerHTML = `<summary class="flex justify-between items-center px-4 py-3 rounded-2xl bg-slate-700 hover:bg-slate-600 cursor-pointer"><span>${local}</span><span class="text-xs bg-slate-800 px-3 py-1 rounded-full">${Object.keys(grouped[local]).length} setores</span></summary>`;
            const inner = document.createElement('div');
            inner.className = 'pl-6 mt-3 space-y-2';
            Object.keys(grouped[local]).sort().forEach(setor => {
                const sub = document.createElement('details');
                sub.innerHTML = `<summary class="px-4 py-2 rounded-xl hover:bg-slate-700 cursor-pointer flex justify-between"><span>${setor}</span><span class="text-xs text-slate-500">(${grouped[local][setor].length})</span></summary>`;
                const list = document.createElement('div');
                list.className = 'pl-6 space-y-1';
                grouped[local][setor].forEach(r => {
                    const row = document.createElement('div');
                    row.className = 'flex justify-between p-2 hover:bg-slate-700 rounded-xl cursor-pointer';
                    row.innerHTML = `<span class="text-blue-400">${r.ramal}</span><span class="text-slate-400">${r.subsetor || ''}</span>`;
                    row.onclick = (e) => { e.stopPropagation(); copyRamal(r.ramal); };
                    list.appendChild(row);
                });
                sub.appendChild(list);
                inner.appendChild(sub);
            });
            details.appendChild(inner);
            container.appendChild(details);
        });
    }
        // Função de tabela completa
        function toggleTable() {
        const tableView = document.getElementById('tableView');
        tableView.classList.toggle('hidden');
        
        if (!tableView.classList.contains('hidden')) {
            renderFullTable();
        }
    }

    function renderFullTable() {
        const header = document.getElementById('tableHeader');
        const tbody = document.getElementById('tableBody');

        // Cabeçalho dinâmico
        header.innerHTML = `
            <th class="p-4 text-left">Local</th>
            <th class="p-4 text-left">Setor</th>
            <th class="p-4 text-left">Subsetor</th>
            <th class="p-4 text-left">Ramal</th>
            <th class="p-4 text-left">Colaborador</th>
            ${isTiMode ? `<th class="p-4 text-left">Workstation</th>` : ''}
        `;

        tbody.innerHTML = ramaisData.map(item => `
            <tr onclick="copyRamal('${item.ramal}')" 
                class="hover:bg-slate-700 cursor-pointer border-b border-slate-700">
                <td class="p-4">${item.local}</td>
                <td class="p-4">${item.setor}</td>
                <td class="p-4">${item.subsetor || ''}</td>
                <td class="p-4 font-bold text-blue-400">${item.ramal}</td>
                <td class="p-4">${item.colaborador || ''}</td>
                ${isTiMode ? `<td class="p-4 font-mono text-emerald-300">${item.Workstation || ''}</td>` : ''}
            </tr>
        `).join('');
    }

    function filterData() {
        const term = document.getElementById('search').value.toLowerCase().trim();
        const localValue = document.getElementById('localFilter').value;
        const filtered = ramaisData.filter(item => {
            if (localValue && item.local !== localValue) return false;
            if (!term) return true;
            return Object.values(item).some(v => v && v.toString().toLowerCase().includes(term));
        });
        renderCards(filtered);
        document.getElementById('resultInfo').textContent = `${filtered.length} de ${ramaisData.length} ramais encontrados`;
    }

    // === ADMIN (mantido) ===
    function openAdminModal() { if (!isTiMode) return; renderAdminTable(); document.getElementById('adminModal').classList.remove('hidden'); }
    function closeAdminModal() { document.getElementById('adminModal').classList.add('hidden'); }

    function renderAdminTable() {
        const tbody = document.getElementById('adminTableBody');
        tbody.innerHTML = ramaisData.map((item, i) => `
            <tr class="hover:bg-slate-800">
                <td class="p-3">${item.local}</td>
                <td class="p-3">${item.setor}</td>
                <td class="p-3">${item.subsetor || ''}</td>
                <td class="p-3 font-bold text-blue-400">${item.ramal}</td>
                <td class="p-3">${item.colaborador || ''}</td>
                <td class="p-3 font-mono text-xs">${item.Workstation || ''}</td>
                <td class="p-3 text-center">
                    <button onclick="editRamal(${i})" class="text-blue-400 hover:text-blue-300 text-2xl mx-2">✏️</button>
                    <button onclick="deleteRamal(${i})" class="text-red-400 hover:text-red-300 text-2xl">🗑️</button>
                </td>
            </tr>
        `).join('');
    }

    window.editRamal = function(i) {
        const item = ramaisData[i];
        const novo = { local: prompt("Local:", item.local)||item.local, setor: prompt("Setor:", item.setor)||item.setor,
            subsetor: prompt("Subsetor:", item.subsetor||"")||item.subsetor, ramal: prompt("Ramal:", item.ramal)||item.ramal,
            colaborador: prompt("Colaborador:", item.colaborador||"")||item.colaborador,
            Workstation: prompt("Workstation:", item.Workstation||"")||item.Workstation };
        ramaisData[i] = novo;
        refreshAll();
    };

    window.deleteRamal = function(i) { if(confirm("Excluir?")) { ramaisData.splice(i,1); refreshAll(); } };
    window.addNewRamal = function() {
        const novo = { local: prompt("Local:","MEDRADIUS CLINICA"), setor: prompt("Setor:"), subsetor: prompt("Subsetor:"),
            ramal: prompt("Ramal:"), colaborador: prompt("Colaborador:"), Workstation: prompt("Workstation:") };
        if(novo.ramal) { ramaisData.push(novo); refreshAll(); }
    };

    function refreshAll() { renderCards(ramaisData); renderTree(); renderAdminTable(); }

    function exportJSON() { /* mesmo código anterior */ 
        const blob = new Blob([JSON.stringify(ramaisData, null, 2)], {type:"application/json"});
        const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "ramais.json"; a.click();
    }

    function exportCSV() { /* mesmo código anterior */ 
        let csv = "local,setor,subsetor,ramal,colaborador,Workstation\n";
        ramaisData.forEach(r => csv += `"${r.local||''}","${r.setor||''}","${r.subsetor||''}","${r.ramal||''}","${r.colaborador||''}","${r.Workstation||''}"\n`);
        const blob = new Blob([csv], {type:"text/csv"}); const a = document.createElement("a");
        a.href = URL.createObjectURL(blob); a.download = "ramais.csv"; a.click();
    }

    window.copyRamal = function(ramal) {
        navigator.clipboard.writeText(ramal);
        const toast = document.createElement('div');
        toast.className = "fixed bottom-8 right-8 bg-emerald-600 text-white px-6 py-3 rounded-2xl shadow-2xl z-50";
        toast.textContent = `✅ Ramal ${ramal} copiado!`;
        document.body.appendChild(toast); setTimeout(() => toast.remove(), 2000);
    };

    document.getElementById('tiBtn').addEventListener('click', () => {
        if (isTiMode) {
            isTiMode = false; document.getElementById('tiBtn').classList.remove('bg-emerald-600'); document.getElementById('adminBtn').classList.add('hidden');
        } else {
            const senha = prompt("🔑 Digite a senha do Modo TI:");
            if (senha === TI_PASSWORD) {
                isTiMode = true; document.getElementById('tiBtn').classList.add('bg-emerald-600'); document.getElementById('adminBtn').classList.remove('hidden');
            } else alert("❌ Senha incorreta!");
        }
        renderCards(ramaisData); // atualiza cards ao mudar modo TI
    });

    document.addEventListener('DOMContentLoaded', () => {
        loadRamais();
        document.getElementById('search').addEventListener('input', filterData);
        document.getElementById('localFilter').addEventListener('change', filterData);
    });
</script>
</body>
</html>
