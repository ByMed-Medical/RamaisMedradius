		<!-- Botão de Alternar Tema (Light / Dark) -->
            <button id="theme-toggle" 
                    style="position: fixed; bottom: 20px; right: 20px; z-index: 9999;
                        padding: 12px 20px; border: none; border-radius: 50px; 
                        background: #222; color: white; font-size: 16px; cursor: pointer;
                        box-shadow: 0 4px 15px rgba(0,0,0,0.4); transition: all 0.3s;">
            🌙 Modo Escuro
            </button>

            <script>
            const toggle = document.getElementById('theme-toggle');
            const html = document.documentElement;

            // Carrega o tema salvo ou prefere o do sistema
            function loadTheme() {
                if (localStorage.getItem('theme') === 'dark' || 
                    (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                html.classList.add('dark');
                toggle.innerHTML = '☀️ Modo Claro';
                } else {
                html.classList.remove('dark');
                toggle.innerHTML = '🌙 Modo Escuro';
                }
            }

            loadTheme();

            // Clique no botão
            toggle.addEventListener('click', () => {
                html.classList.toggle('dark');

                if (html.classList.contains('dark')) {
                toggle.innerHTML = '☀️ Modo Claro';
                localStorage.setItem('theme', 'dark');
                } else {
                toggle.innerHTML = '🌙 Modo Escuro';
                localStorage.setItem('theme', 'light');
                }
            });
            </script>

    // Função de render dos cards - MELHORIA RADICAL (estável em claro/escuro)
    function renderCards(items) {
        const container = document.getElementById('cardsContainer');
        container.innerHTML = '';

        if (items.length === 0) {
            container.innerHTML = '<p class="col-span-full text-center py-12 text-gray-500 text-lg">Nenhum ramal encontrado</p>';
            return;
        }

        items.forEach(item => {
            const card = document.createElement('div');
            card.className = 'ramal-card rounded-3xl shadow-lg border overflow-hidden flex flex-col';

            const splitList = (str) => {
                if (!str || typeof str !== 'string') return [];
                return str.split(/[/,;|]\s*/).map(s => s.trim()).filter(Boolean);
            };

            const subsetores = splitList(item.subsetor);
            const colaboradores = splitList(item.colaborador);
            const workstations = splitList(item.Workstation);

            const maxLength = Math.max(subsetores.length, colaboradores.length, workstations.length);

            const rows = [];
            for (let i = 0; i < maxLength; i++) {
                rows.push({
                    subsetor: subsetores[i] || '—',
                    colaborador: colaboradores[i] || '—',
                    workstation: workstations[i] || '—'
                });
            }

            let html = `
                <!-- Header - Gradiente Azul (igual nos dois modos) -->
                <div class="bg-gradient-to-r from-blue-700 to-indigo-700 text-white px-6 py-5 flex justify-between items-start">
                    <div class="text-5xl md:text-6xl font-black tracking-tighter drop-shadow-md">
                        ${item.ramal}
                    </div>
                    <div class="text-right">
                        <div class="text-sm font-semibold uppercase tracking-wide">${item.setor}</div>
                        <div class="text-xs opacity-75 mt-1">${item.local}</div>
                    </div>
                </div>

                <!-- Corpo da Tabela -->
                <div class="card-body p-6">
                    <table class="w-full text-sm border border-gray-200 dark:border-slate-600 rounded-xl overflow-hidden">
                        <thead>
                            <tr>
                                <th class="p-3 text-left font-medium text-light">Subsetor</th>
                                <th class="p-3 text-left font-medium text-light">Colaborador</th>
                                <th class="p-3 text-left font-medium text-light">Workstation</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-gray-100 dark:divide-slate-600">
                            ${rows.map(row => `
                                <tr class="hover:bg-gray-50 dark:hover:bg-slate-700 transition-colors">
                                    <td class="p-3 text-light">${row.subsetor}</td>
                                    <td class="p-3 text-light">${row.colaborador}</td>
                                    <td class="p-3 font-mono text-light">${row.workstation}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;

            card.innerHTML = html;
            container.appendChild(card);
        });
    }

    // Mapa mental (árvore) – versão mais robusta
    function renderTree() {
        const container = document.getElementById('treeView');
        if (!container) return;
        container.innerHTML = '';

        const grouped = {};
        ramaisData.forEach(item => {
            if (!item.local) return;
            if (!grouped[item.local]) grouped[item.local] = {};
            if (!grouped[item.local][item.setor]) grouped[item.local][item.setor] = [];
            grouped[item.local][item.setor].push(item);
        });

        Object.keys(grouped).sort().forEach(local => {
            const details = document.createElement('details');
            details.className = 'mb-3';
            details.innerHTML = `<summary class="font-semibold text-blue-600 bg-blue-50 px-4 py-2 rounded-2xl flex items-center gap-2 cursor-pointer">${local}</summary>`;

            const inner = document.createElement('div');
            inner.className = 'pl-6 mt-2';

            Object.keys(grouped[local]).sort().forEach(setor => {
                const subDetails = document.createElement('details');
                subDetails.innerHTML = `<summary class="font-medium cursor-pointer py-1">${setor}</summary>`;

                const list = document.createElement('div');
                list.className = 'pl-6 text-xs space-y-1';
                grouped[local][setor].forEach(r => {
                    const row = document.createElement('div');
                    row.className = 'flex justify-between hover:bg-gray-100 p-2 rounded-xl cursor-pointer';
                    row.onclick = () => copyRamal(r.ramal);
                    row.innerHTML = `
                        <span>${r.ramal} - ${r.subsetor || ''}</span>
                        ${r.Workstation ? `<span class="text-gray-400">${r.Workstation}</span>` : ''}
                    `;
                    list.appendChild(row);
                });
                subDetails.appendChild(list);
                inner.appendChild(subDetails);
            });

            details.appendChild(inner);
            container.appendChild(details);
        });

        if (Object.keys(grouped).length === 0) {
            container.innerHTML = '<p class="text-gray-500">Nenhum dado carregado</p>';
        }
    }

    // Filtro corrigido (só busca ramal quando é número puro)
    function filterData() {
        const searchInput = document.getElementById('search');
        const localFilter = document.getElementById('localFilter');
        if (!searchInput || !localFilter) return;

        const term = searchInput.value.toLowerCase().trim();
        const localValue = localFilter.value;

        const isPureNumber = term && /^\d+$/.test(term);

        const filtered = ramaisData.filter(item => {
            if (!item) return false;

            const matches = [];

            if (item.ramal?.toLowerCase().includes(term)) matches.push(true);
            if (item.setor?.toLowerCase().includes(term)) matches.push(true);
            if (item.subsetor?.toLowerCase().includes(term)) matches.push(true);
            if (item.local?.toLowerCase().includes(term)) matches.push(true);
            if (item.colaborador?.toLowerCase().includes(term)) matches.push(true);

            // Workstation só se NÃO for busca só por número
            if (!isPureNumber && item.Workstation?.toLowerCase().includes(term)) {
                matches.push(true);
            }

            const anyMatch = matches.length > 0;

            const localOk = !localValue || item.local === localValue;

            return anyMatch && localOk;
        });

        renderCards(filtered);
    }

async function simpleHash(str) {
    const msgBuffer = new TextEncoder().encode(str);
    const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
    const hashArray = Array.from(new Uint8Array(hashBuffer));
    return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
}

// ==================== SALVAR NO GITHUB ====================
async function saveToGitHub() {
    if (!githubToken) {
        alert("⚠️ Insira seu GitHub Personal Access Token primeiro.");
        return;
    }

    const commitMessage = prompt("Mensagem de commit:", `Atualização de ramais - ${new Date().toLocaleDateString('pt-BR')}`);
    if (!commitMessage) return;

    try {
        let sha = null;
        try {
            const getResp = await fetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${FILE_PATH}`, {
                headers: { 'Authorization': `token ${githubToken}` }
            });
            if (getResp.ok) {
                const data = await getResp.json();
                sha = data.sha;
            }
        } catch (e) {}

        const contentBase64 = btoa(unescape(encodeURIComponent(JSON.stringify(ramaisData, null, 2))));

        const response = await fetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${FILE_PATH}`, {
            method: 'PUT',
            headers: {
                'Authorization': `token ${githubToken}`,
                'Accept': 'application/vnd.github.v3+json',
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                message: commitMessage,
                content: contentBase64,
                sha: sha,
                branch: BRANCH
            })
        });

        if (response.ok) {
            alert("✅ Dados salvos com sucesso no GitHub!");
            renderCards(ramaisData);
            renderTree();
        } else {
            const err = await response.json();
            alert("Erro:\n" + (err.message || "Token inválido ou sem permissão."));
        }
    } catch (err) {
        alert("Erro de conexão: " + err.message);
    }
}

document.getElementById('exportCsvBtn').addEventListener('click', () => {
    const headers = ["local","setor","subsetor","ramal","Workstation","colaborador"];
    const csv = [headers.join(','), ...ramaisData.map(row => 
        headers.map(h => `"${(row[h] || '').toString().replace(/"/g,'""')}"`).join(',')
    )].join('\n');

    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = `ramais_medradius_${new Date().toISOString().slice(0,10)}.csv`;
    link.click();
    URL.revokeObjectURL(url);
});

document.getElementById('importCsv').addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = event => {
        const text = event.target.result;
        const lines = text.split(/\r?\n/);
        const newData = [];

        for (let i = 1; i < lines.length; i++) {
            if (!lines[i].trim()) continue;
            const cols = lines[i].split(',').map(c => c.trim().replace(/^"|"$/g,'').replace(/""/g,'"'));
            if (cols.length < 4) continue;
            newData.push({
                local: cols[0] || "",
                setor: cols[1] || "",
                subsetor: cols[2] || "",
                ramal: cols[3] || "",
                Workstation: cols[4] || "",
                colaborador: cols[5] || ""
            });
        }

        if (newData.length > 0 && confirm(`Importar ${newData.length} ramais?`)) {
            ramaisData.length = 0;
            ramaisData.push(...newData);
            loadEditableTable();
            alert("Dados importados! Clique em 'Salvar no GitHub' para publicar.");
        }
    };
    reader.readAsText(file);
});
