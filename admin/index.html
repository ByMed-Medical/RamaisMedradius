<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="styles.css">
  <meta charset="utf-8" />
  <title>Editar Ramais - MedRadius</title>
</head>
<body>
  <script src="https://unpkg.com/decap-cms@^3.3.0/dist/decap-cms.js"></script>
  <!-- Botão Toggle Dark/Light Mode -->
<button id="theme-toggle" 
        style="position: fixed; bottom: 25px; right: 25px; z-index: 10000; 
               padding: 12px 18px; border: none; border-radius: 50px; 
               background: #222; color: white; font-size: 15px; cursor: pointer;
               box-shadow: 0 4px 15px rgba(0,0,0,0.4); transition: all 0.3s;">
  🌙 Modo Escuro
</button>

<script>
  const btn = document.getElementById('theme-toggle');
  const html = document.documentElement;

  // Verifica tema salvo ou preferência do sistema
  if (localStorage.getItem('theme') === 'dark' || 
      (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
    html.classList.add('dark');
    btn.innerHTML = '☀️ Modo Claro';
  }

  btn.addEventListener('click', () => {
    html.classList.toggle('dark');

    if (html.classList.contains('dark')) {
      btn.innerHTML = '☀️ Modo Claro';
      localStorage.setItem('theme', 'dark');
    } else {
      btn.innerHTML = '🌙 Modo Escuro';
      localStorage.setItem('theme', 'light');
    }
  });
</script>
</body>
</html>
